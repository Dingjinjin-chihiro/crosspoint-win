name: build

on:
  push:
    branches: [main, latest-firmware]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (MSYS2 / MinGW-w64)
    runs-on: windows-latest

    steps:
      # Windows runners default to core.autocrlf=true, which rewrites sources to
      # CRLF and breaks the firmware's .patch files / patch scripts.
      - name: Disable CRLF conversion before checkout
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global --get core.autocrlf

      - name: Checkout (with firmware submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up MSYS2 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git
            patch
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python

      # No patches are needed for the pinned 2.x firmware, but keep the step so a
      # future fix can just be dropped into patches/.
      - name: Apply firmware patches (if any)
        shell: msys2 {0}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/Crosspoint"
          echo "firmware: $(git rev-parse HEAD) ($(git rev-parse --abbrev-ref HEAD))"
          shopt -s nullglob
          for p in "$GITHUB_WORKSPACE"/patches/*.patch; do
            if git apply --reverse --check "$p" >/dev/null 2>&1; then
              echo "already applied: $(basename "$p")"
            else
              git apply "$p"
              echo "applied: $(basename "$p")"
            fi
          done
          git --no-pager diff --stat

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCROSSPOINT_ROOT="$GITHUB_WORKSPACE/Crosspoint"

      - name: Build
        shell: msys2 {0}
        run: cmake --build "$GITHUB_WORKSPACE/build" -j "$(nproc)"

      - name: Stage runnable bundle
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$GITHUB_WORKSPACE/build/crosspoint_emulator.exe" "$GITHUB_WORKSPACE/dist/"
          # The build statically links the MinGW runtime; SDL2.dll is what has to ship.
          cp "$GITHUB_WORKSPACE/build/"*.dll "$GITHUB_WORKSPACE/dist/" 2>/dev/null || true
          if ! ls "$GITHUB_WORKSPACE/dist/"*.dll >/dev/null 2>&1; then
            cp /mingw64/bin/SDL2.dll "$GITHUB_WORKSPACE/dist/"
          fi
          ls -l "$GITHUB_WORKSPACE/dist"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: crosspoint-emulator-windows
          path: dist/*
          retention-days: 30
